name: Pull Request Report

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  generate-report:
    runs-on: ubuntu-latest

    environment: github-pr-env

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create Virtual Environment
        run: |
          python -m venv venv

      - name: Install Dependencies
        run: |
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r github_pr_tool/requirements.txt

      - name: Extract PR Configuration
        shell: bash
        run: |
          PR_BODY='${{ github.event.pull_request.body }}'

          PR_NUMBERS=$(echo "$PR_BODY" | grep -oP 'number_of_prs=\K\d+' || echo "10")

          REPO_URL=$(echo "$PR_BODY" | grep -oP 'repo_url=\Khttps://github\.com/\S+' || true)

          if [ -z "$REPO_URL" ]; then
            REPO="${{ github.repository }}"
          else
            REPO=$(echo "$REPO_URL" | sed 's#https://github.com/##')
          fi

          echo "PR_NUMBERS=$PR_NUMBERS" >> $GITHUB_ENV
          echo "REPO=$REPO" >> $GITHUB_ENV

      - name: Run PR Tool
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          source venv/bin/activate

          python github_pr_tool/github_pr_tool.py \
            --list_pr \
            --repo "$REPO" \
            --numbers "$PR_NUMBERS" \
            --status merged

      - name: Upload Reports
        uses: actions/upload-artifact@v5
        with:
          name: pr-reports
          path: |
            report.json
            report.xlsx